<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" role="img" aria-label="Chat and Harness switch in the DSH title bar">
  <defs>
    <linearGradient id="thumb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4a54"/>
      <stop offset="1" stop-color="#3a3a43"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26262c"/>
      <stop offset="1" stop-color="#1d1d22"/>
    </linearGradient>
  </defs>

  <rect width="880" height="240" fill="#16161a"/>

  <!-- Chat mode -->
  <text x="28" y="42" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#8b8b93">Chat mode</text>
  <text x="28" y="62" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5f5f68">site picker visible, web page fills the window</text>

  <g>
    <rect x="500" y="30" width="44" height="40" rx="13" fill="url(#pill)" stroke="#3a3a42"/>
    <circle cx="519" cy="50" r="8.5" fill="none" stroke="#7aa2ff" stroke-width="1.6"/>
    <path d="M510.5 50h17M519 41.5c-3 5.4-3 11.6 0 17M519 41.5c3 5.4 3 11.6 0 17" fill="none" stroke="#7aa2ff" stroke-width="1.4"/>

  </g>

  <g>
    <rect x="560" y="30" width="280" height="44" rx="22" fill="url(#pill)" stroke="#3a3a42"/>
    <rect x="564" y="34" width="136" height="36" rx="18" fill="url(#thumb)" stroke="#55555f"/>
    <text x="632" y="57" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff">Chat</text>
    <text x="768" y="57" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#7e7e87">Harness</text>
  </g>

  <line x1="28" y1="120" x2="852" y2="120" stroke="#26262c"/>

  <!-- Harness mode -->
  <text x="28" y="162" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#8b8b93">Harness mode</text>
  <text x="28" y="182" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5f5f68">picker hides, the normal DSH workspace is back</text>

  <g>
    <rect x="560" y="150" width="280" height="44" rx="22" fill="url(#pill)" stroke="#3a3a42"/>
    <rect x="700" y="154" width="136" height="36" rx="18" fill="url(#thumb)" stroke="#55555f"/>
    <text x="632" y="177" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#7e7e87">Chat</text>
    <text x="768" y="177" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff">Harness</text>
  </g>
</svg>
